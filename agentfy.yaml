version: "1.0"

# 1. Basic Metadata (For the Storefront)
agent:
  name: "Email Support Agent"
  developer_id: "dev_email_pro"
  short_description: "AI-powered Gmail monitoring and automatic customer replies."
  description: >-
    An AI-powered agent that monitors your Gmail inbox and automatically
    replies to customer inquiries using your business knowledge base.
    Supports PDF, DOCX, XLSX, and plaintext FAQ for RAG-powered responses.
  category: "customer_service"

# 2. Defining the Agent's Shape
interaction_mode: "webhook_automation" 

# 3. Mode-Specific Configurations
ui_capabilities:
  has_custom_avatar: true
  supports_file_uploads: true
  allowed_placements: ["bottom_right"]

# 4. Demo Simulation
demo_simulation:
  input_label: "Paste a sample customer email:"
  sample_input: "Subject: Refund Inquiry - Order #5543\nHi, I haven't received my refund for the order I returned last week. Can you check?"
  simulated_output_description: "The agent will analyze the email, consult the knowledge base, and draft/send a professional reply."

# 5. Business Onboarding Schema
installation_config:
  - field_id: "business_name"
    name: "Business Name"
    type: "text"
    required: true

  - field_id: "gmail_address"
    name: "Gmail Address"
    type: "text"
    required: true

  - field_id: "gmail_app_password"
    name: "Gmail App Password"
    type: "secret"
    required: true

# RAG Configuration
rag:
  enabled: true
  vector_store: "qdrant"
  embedding_model: "gemini-embedding-2"
  supported_files:
    - ".pdf"
    - ".docx"
    - ".xlsx"
    - ".txt"
  allow_text_input: true
  max_file_size_mb: 10
  chunk_strategy: "paragraph"
  chunk_overlap_words: 50

# Legacy compatibility & Metadata
trigger: "email"
price: 10.0
use_managed_db: true
interface:
  type: "automation"
